<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf - Your Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="ticket-page">
    <header class="main-header center-header">
        <div class="logo-container">
            <img src="assets/images/logo-mark.png" alt="Coding Conf Logo Mark" width="40" height="40">
            <span>Coding Conf</span>
        </div>
    </header>

    <main class="ticket-main">
        <div class="confirmation-text">
            <h1>Congrats, <span class="highlight-orange" id="display-name">Name</span>!<br>Your ticket is ready.</h1>
            <p>We've emailed your ticket to <br class="mobile-break"><span class="highlight-orange" id="display-email"></span> and will send updates in the run up to the event.</p>
        </div>

        <article class="glass-ticket" aria-label="Coding Conf ticket">

    <div class="ticket-left">
      <header class="ticket-header">
        <div class="logo-container">
          <img src="assets/images/logo-mark.png" alt="" width="28" height="28">
          <span>Coding Conf</span>
        </div>
        <p class="ticket-date">Oct 26, 2026 / Papine, KGN</p>
                 <div class="ticket-user">
        <img class="avatar-img" id="ticket-avatar"
             src="assets/images/image-avatar.jpg" alt="">
        <div class="user-info">
          <h3 id="ticket-name">Full Name</h3>
          <a class="github-link" id="ticket-github"
             href="#" target="_blank" rel="noopener noreferrer">
            <img src="assets/images/icon-github.png" alt="" width="16" height="16">
            <span id="ticket-handle">@username</span>
        </a>
        </div>
      </div>
    </div>
            <div class="ticket-right">
      <span class="ticket-number" id="ticket-serial">#01609</span>
    </div>

  </article>
</main>
	<footer class="main-footer">
		<p>&copy; 2026 Coding Conf. All rights reserved.</p>
	</footer>
